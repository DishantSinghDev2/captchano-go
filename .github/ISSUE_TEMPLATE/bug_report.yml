name: Bug report
description: Something in the CaptchaNo SDK isn't working as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short snippet. **Remove API keys, proxy credentials and captcha tokens.**
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: SDK version and runtime
      placeholder: e.g. 1.0.0 on Go 1.24
    validations: { required: true }
